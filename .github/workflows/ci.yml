# Build and test on every push and pull request. Warnings fail the build (Directory.Build.props); the API tests start
# one PostgreSQL container for the whole run (Testcontainers, Docker is available on GitHub-hosted runners).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Gebeta.slnx
      - name: Build
        run: dotnet build Gebeta.slnx --no-restore -c Release
      - name: Pending model changes
        run: |
          dotnet tool restore
          for ctx in Core:CoreDbContext Payroll:PayrollDbContext Hr:HrDbContext Accounting:AccountingDbContext Cash:CashDbContext Stock:StockDbContext Buying:BuyingDbContext Selling:SellingDbContext; do
            module=${ctx%%:*}; context=${ctx##*:}
            dotnet dotnet-ef migrations has-pending-model-changes --no-build -c Release \
              --project src/Modules/$module/Gebeta.$module.Infrastructure --startup-project src/Gebeta.Api --context $context
          done
      - name: Test
        run: dotnet test --solution Gebeta.slnx --no-build -c Release

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check and build
        run: npm run build
      - name: Unit tests
        run: npm test
