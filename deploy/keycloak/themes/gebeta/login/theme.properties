# Gebeta ERP login theme (Abay Systems).
# Extends Keycloak's current login theme and only changes the look and the texts.
parent=keycloak.v2
import=common/keycloak

# css/styles.css comes from keycloak.v2; css/gebeta.css is ours and loads after it.
styles=css/styles.css css/gebeta.css

# One consistent brand look; switch back to true to follow the user's dark mode.
darkMode=false
