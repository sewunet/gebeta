# Gebeta ERP: local and single-server set-up.
#
#   cp deploy/.env.example deploy/.env      # then fill in the passwords
#   docker compose -f deploy/docker-compose.yml up -d                 # infrastructure only (development)
#   docker compose -f deploy/docker-compose.yml --profile app up -d   # infrastructure + Gebeta images
#
# See docs/deployment.md.

name: gebeta

x-server-env: &server-env
  ConnectionStrings__Main: Host=postgres;Database=${POSTGRES_DB:-gebeta};Username=${POSTGRES_USER:-gebeta};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  RabbitMq__Host: rabbitmq
  RabbitMq__VirtualHost: ${RABBITMQ_VHOST:-gebeta}
  RabbitMq__Username: ${RABBITMQ_USER:-gebeta}
  RabbitMq__Password: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
  Redis__Configuration: redis:6379
  Auth__Authority: http://keycloak:8080/realms/gebeta
  Serilog__WriteTo__0__Name: Seq
  Serilog__WriteTo__0__Args__serverUrl: http://seq:5341
  # Modules running in this container (see docs/plugin-architecture.md)
  Modules__Enabled__0: core
  Modules__Enabled__1: hr
  Modules__Enabled__2: payroll
  Modules__Enabled__3: cash
  Modules__Enabled__4: accounting

services:
  postgres:
    image: postgres:18.3
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gebeta}
      POSTGRES_USER: ${POSTGRES_USER:-gebeta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql        # PostgreSQL 18 keeps its data under a versioned sub-folder
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    hostname: gebeta-rabbitmq        # fixed hostname keeps the node name and its data stable
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-gebeta}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-gebeta}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"              # AMQP
      - "${RABBITMQ_UI_PORT:-15672}:15672"         # management UI
      - "${RABBITMQ_METRICS_PORT:-15692}:15692"    # Prometheus metrics
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.6
    restart: unless-stopped
    # start-dev uses an embedded database: fine for development only.
    # Production: "start" with KC_DB=postgres and a hostname, see docs/deployment.md.
    command: ["start-dev", "--http-port=8080", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/themes/gebeta:/opt/keycloak/themes/gebeta:ro      # Gebeta login theme
      - ./keycloak/import:/opt/keycloak/data/import:ro               # realm "gebeta" (imported once)

  seq:
    image: datalust/seq:2024.3
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"   # development only
    ports:
      - "${SEQ_PORT:-5341}:80"
    volumes:
      - seq-data:/data

  # ---- Gebeta application (images are built by CI; not available yet) ----

  migrate:
    profiles: ["app"]
    image: abay/gebeta-migrate:${GEBETA_VERSION:-dev}
    environment: *server-env
    depends_on:
      postgres:
        condition: service_healthy

  server:
    profiles: ["app"]
    image: abay/gebeta-server:${GEBETA_VERSION:-dev}
    restart: unless-stopped
    environment:
      <<: *server-env
      Gebeta__Role: Api
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10

  jobs:
    profiles: ["app"]
    image: abay/gebeta-server:${GEBETA_VERSION:-dev}
    restart: unless-stopped
    environment:
      <<: *server-env
      Gebeta__Role: Jobs
    depends_on:
      server:
        condition: service_healthy

  web:
    profiles: ["app"]
    image: abay/gebeta-web:${GEBETA_VERSION:-dev}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:
  rabbitmq-data:
  redis-data:
  keycloak-data:
  seq-data:
